name: mova-fpl

x-engine: &engine
  image: mova-fpl-engine:${MOVA_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: deploy/docker/engine.Dockerfile
    args:
      MOVA_GIT_SHA: ${MOVA_GIT_SHA:-unknown}
  env_file:
    - path: ${MOVA_ENV_FILE:-/etc/mova-fpl/runtime.env}
      required: false
  environment:
    MOVA_GIT_SHA: ${MOVA_GIT_SHA:-unknown}
    MOVA_CANONICAL_DB: /var/lib/mova-fpl/db/fpl_canonical.db
    MOVA_TRACE_DB: /var/lib/mova-fpl/db/trace.db
    MOVA_MODEL_ROOT: /var/lib/mova-fpl/artifacts/models
    MOVA_POSTGRES_HOST: postgres
    MOVA_POSTGRES_PORT: "5432"
    MOVA_POSTGRES_DB: ${MOVA_POSTGRES_DB:-mova}
    MOVA_POSTGRES_USER: ${MOVA_POSTGRES_USER:-mova_owner}
    MOVA_POSTGRES_CREDENTIAL_FILE: /run/secrets/postgres_password
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - control
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: postgres:17.11-bookworm@sha256:07edf880f0cf3f742c990d23faf92cb19e84923a8bce30f7d8e1a8ab63cae7b3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOVA_POSTGRES_DB:-mova}
      POSTGRES_USER: ${MOVA_POSTGRES_USER:-mova_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - log_min_duration_statement=1000
    secrets:
      - postgres_password
    volumes:
      - ${MOVA_DATA_ROOT:-/var/lib/mova-fpl}/postgres:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    <<: *engine
    command: ["python", "-m", "mova_fpl.ops.cli", "serve"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # SQLite WAL readers need to create/open the shared-memory sidecar. The
      # API itself opens query_only; only the DB directory is writable here.
      - ${MOVA_DATA_ROOT:-/var/lib/mova-fpl}/db:/var/lib/mova-fpl/db
      # El contrato HTTP debe observar los mismos artefactos/probe que el CLI,
      # sin obtener escritura sobre ninguno de los dos.
      - ${MOVA_DATA_ROOT:-/var/lib/mova-fpl}/artifacts:/var/lib/mova-fpl/artifacts:ro
      - ${MOVA_DATA_ROOT:-/var/lib/mova-fpl}/runtime:/var/lib/mova-fpl/runtime:ro
    ports:
      - "127.0.0.1:${MOVA_API_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 0.40
    pids_limit: 128

  worker:
    <<: *engine
    command: ["python", "-m", "mova_fpl.ops.cli", "tick"]
    profiles: ["jobs"]
    restart: "no"
    networks:
      - worker_egress
      - data
    secrets:
      - postgres_password
    volumes:
      - ${MOVA_DATA_ROOT:-/var/lib/mova-fpl}:/var/lib/mova-fpl
      - ${MOVA_BACKUP_ROOT:-/opt/orbital/backups/mova-fpl}:/opt/orbital/backups/mova-fpl
    mem_limit: 3g
    cpus: 1.50
    pids_limit: 256

  browser:
    image: mova-fpl-browser:${MOVA_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/browser.Dockerfile
      args:
        MOVA_GIT_SHA: ${MOVA_GIT_SHA:-unknown}
    profiles: ["browser"]
    restart: unless-stopped
    init: true
    environment:
      MOVA_ENABLE_BROWSER_WRITES: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - ${MOVA_BROWSER_PROFILE:-/var/lib/mova-fpl/browser-profile}:/var/lib/mova-fpl/browser-profile
    ports:
      - "127.0.0.1:${MOVA_NOVNC_PORT:-6080}:6080"
    networks:
      - browser_egress
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:6080/vnc.html >/dev/null && curl --fail --silent http://127.0.0.1:9222/json/version >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1250m
    cpus: 0.75
    pids_limit: 256
    shm_size: 512m

networks:
  control: {}
  worker_egress: {}
  browser_egress: {}
  data:
    internal: true

secrets:
  postgres_password:
    file: ${MOVA_POSTGRES_PASSWORD_FILE:-/etc/mova-fpl/postgres-password}
