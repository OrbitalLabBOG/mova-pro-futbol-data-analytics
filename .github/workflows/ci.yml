name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --requirement requirements/test.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q mova_fpl
      - run: for file in deploy/bin/*.sh; do bash -n "$file"; done
      - run: for file in deploy/research/*.mjs deploy/browser/*.js deploy/browser/*.mjs; do node --check "$file"; done
      - run: docker compose config --no-interpolate --no-env-resolution --quiet
      - run: pytest -q
  image-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f deploy/docker/engine.Dockerfile --build-arg MOVA_GIT_SHA="$GITHUB_SHA" -t mova-engine-smoke .
      - run: docker run --rm --network none mova-engine-smoke python -m mova_fpl.ops.cli --help
